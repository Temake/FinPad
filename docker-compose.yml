services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: finpad_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finpad
      POSTGRES_PASSWORD: finpad
      POSTGRES_DB: finpad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: finpad_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Evolution API (WhatsApp Gateway)
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.1
    container_name: finpad_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-change-me}
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - CORS_ORIGIN=${EVOLUTION_CORS_ORIGIN:-*}
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_GLOBAL_EVENTS=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://finpad:finpad@db:5432/finpad
      # Redis configuration
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
